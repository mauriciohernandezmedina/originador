server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: originador-analytics
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/llm_analytics}
    username: ${POSTGRES_USER:originador_user}
    password: ${POSTGRES_PASSWORD:originador_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

app:
  api-key: ${APP_API_KEY:originador-llm-secret-key-2026}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
