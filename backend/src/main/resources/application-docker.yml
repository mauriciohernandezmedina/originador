spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/llm_analytics}
    username: ${POSTGRES_USER:originador_user}
    password: ${POSTGRES_PASSWORD:originador_secret}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
